<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記憶星空 Memory Constellation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #a5c9ff;
      text-shadow: 0 0 10px rgba(165, 201, 255, 0.5);
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      color: #8fa0b5;
    }

    .stats span {
      color: #ffd700;
      font-weight: bold;
    }

    /* 星星棋盤 */
    .game-board {
      display: grid;
      grid-template-columns: repeat(2, 120px);
      grid-gap: 20px;
      margin: 20px 0;
    }

    .star-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s, background-color 0.2s;
      opacity: 0.6;
    }

    .star-btn:active {
      transform: scale(0.95);
    }

    /* 四顆星星的不同主題色彩 */
    #star-0 { background: #ff4757; box-shadow: 0 0 15px #ff4757; }
    #star-1 { background: #2ed573; box-shadow: 0 0 15px #2ed573; }
    #star-2 { background: #1e90ff; box-shadow: 0 0 15px #1e90ff; }
    #star-3 { background: #ffa502; box-shadow: 0 0 15px #ffa502; }

    /* 亮起效果 */
    .star-btn.active {
      opacity: 1;
      transform: scale(1.1);
      box-shadow: 0 0 35px #ffffff, 0 0 50px currentColor;
    }

    /* 控制按鈕與訊息 */
    .controls {
      margin-top: 15px;
      text-align: center;
    }

    .btn {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(142, 45, 226, 0.4);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(142, 45, 226, 0.6);
    }

    .message {
      margin-top: 15px;
      font-size: 1rem;
      height: 24px;
      color: #d1d8e0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>記憶星空</h1>
    <div class="stats">
      <div>當前關卡：<span id="level">0</span></div>
      <div>最高紀錄：<span id="high-score">0</span></div>
    </div>
  </div>

  <div class="game-board">
    <div class="star-btn" id="star-0" onclick="handleStarClick(0)"></div>
    <div class="star-btn" id="star-1" onclick="handleStarClick(1)"></div>
    <div class="star-btn" id="star-2" onclick="handleStarClick(2)"></div>
    <div class="star-btn" id="star-3" onclick="handleStarClick(3)"></div>
  </div>

  <div class="controls">
    <button class="btn" id="start-btn" onclick="startGame()">開始遊戲</button>
    <div class="message" id="message">按下「開始遊戲」挑戰你的記憶力！</div>
  </div>

  <script>
    let sequence = [];
    let playerSequence = [];
    let level = 0;
    let highScore = 0;
    let isPlayingSequence = false;
    let gameActive = false;

    const levelEl = document.getElementById('level');
    const highScoreEl = document.getElementById('high-score');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    function startGame() {
      sequence = [];
      playerSequence = [];
      level = 0;
      gameActive = true;
      startBtn.style.display = 'none';
      messageEl.textContent = '仔細觀察星光順序...';
      nextRound();
    }

    function nextRound() {
      level++;
      levelEl.textContent = level;
      playerSequence = [];
      
      // 隨機增加一個新的星星編號 (0 - 3)
      sequence.push(Math.floor(Math.random() * 4));
      
      playSequence();
    }

    function playSequence() {
      isPlayingSequence = true;
      let i = 0;

      const interval = setInterval(() => {
        flashStar(sequence[i]);
        i++;
        if (i >= sequence.length) {
          clearInterval(interval);
          setTimeout(() => {
            isPlayingSequence = false;
            messageEl.textContent = '輪到你了！請依順序點擊。';
          }, 600);
        }
      }, 800);
    }

    function flashStar(index) {
      const star = document.getElementById(`star-${index}`);
      star.classList.add('active');
      setTimeout(() => {
        star.classList.remove('active');
      }, 400);
    }

    function handleStarClick(index) {
      if (!gameActive || isPlayingSequence) return;

      flashStar(index);
      playerSequence.push(index);

      // 檢查目前點擊是否正確
      const currentIndex = playerSequence.length - 1;
      if (playerSequence[currentIndex] !== sequence[currentIndex]) {
        gameOver();
        return;
      }

      // 如果完成當前輪次的所有點擊
      if (playerSequence.length === sequence.length) {
        messageEl.textContent = '答對了！準備下一關...';
        isPlayingSequence = true;
        setTimeout(() => {
          nextRound();
        }, 1200);
      }
    }

    function gameOver() {
      gameActive = false;
      messageEl.textContent = `遊戲結束！你的最終關卡是 ${level}。`;
      
      if (level > highScore) {
        highScore = level;
        highScoreEl.textContent = highScore;
      }
      
      startBtn.style.display = 'inline-block';
      startBtn.textContent = '重新開始';
    }
  </script>
</body>
</html>
